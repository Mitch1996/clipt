<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .stage{display:flex;align-items:center;gap:32px;justify-content:center;height:140px;
    background:linear-gradient(135deg,hsl(230 24% 7%),hsl(252 60% 18%));border-radius:var(--radius);padding:16px}

  /* Verified-attribution badge */
  .vbadge{
    display:inline-flex;align-items:center;gap:8px;
    padding:6px 14px 6px 10px;border-radius:9999px;
    background:hsl(var(--accent) / 0.15);
    border:1px solid hsl(var(--accent) / 0.45);
    color:#fff;font-weight:600;font-size:13px;line-height:1;
    backdrop-filter:blur(8px);
  }
  .vbadge .check{
    width:18px;height:18px;border-radius:9999px;background:hsl(var(--accent));
    display:inline-flex;align-items:center;justify-content:center;color:#fff;
  }
  .vbadge .check svg{width:11px;height:11px}
  .vbadge.live{ animation: pulse-attribution 2s ease-in-out infinite; }

  .legend{font-size:11px;color:#fff8;text-transform:uppercase;letter-spacing:0.08em;font-weight:600;text-align:center;margin-top:6px}
</style></head>
<body><div class="card">
  <div class="label">Verified-attribution badge</div>
  <div class="stage">
    <div style="text-align:center">
      <span class="vbadge">
        <span class="check"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></span>
        Verified attribution
      </span>
      <div class="legend">at rest</div>
    </div>
    <div style="text-align:center">
      <span class="vbadge live">
        <span class="check"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></span>
        Verified attribution
      </span>
      <div class="legend">pulse-attribution · 2s ∞</div>
    </div>
  </div>
  <div style="font-size:12px;color:hsl(var(--muted-foreground));line-height:1.5">
    Plays once when the clip's split is confirmed and a payout posts. Defined as <span class="mono">@keyframes pulse-attribution</span>; respects <span class="mono">prefers-reduced-motion</span>.
  </div>
</div></body></html>
