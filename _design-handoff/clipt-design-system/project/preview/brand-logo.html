<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .stage{display:flex;align-items:center;justify-content:center;height:120px;border-radius:var(--radius);border:1px solid hsl(var(--border))}
  .stage.dark{background:hsl(230 24% 7%);border-color:hsl(230 18% 18%)}
</style></head>
<body><div class="card">
  <div class="label">Logo · wordmark</div>
  <div class="row" style="gap:14px">
    <div class="stage" style="flex:1;background:#fff"><img src="../assets/logo.svg" style="height:44px" alt="Clipt"></div>
    <div class="stage dark" style="flex:1"><img src="../assets/logo-dark.svg" style="height:44px" alt="Clipt"></div>
  </div>
  <div style="font-size:12px;color:hsl(var(--muted-foreground));line-height:1.5">
    Inter 800 with −1.5 letter-spacing. The purple dot is a separate <span class="mono">&lt;circle id="dot"&gt;</span> so it can pulse independently — see the verified-attribution badge.
  </div>
</div></body></html>
