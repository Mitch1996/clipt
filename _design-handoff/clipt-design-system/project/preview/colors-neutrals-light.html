<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="label">Neutrals · light mode</div>
  <div class="row">
    <div class="swatch" style="background:#FFFFFF"><div class="name">background</div><div class="hex">#FFFFFF</div></div>
    <div class="swatch" style="background:#F4F4F7"><div class="name">muted / secondary</div><div class="hex">#F4F4F7</div></div>
    <div class="swatch" style="background:#E6E6EB"><div class="name">border</div><div class="hex">#E6E6EB</div></div>
    <div class="swatch" style="background:#6B6B73;color:#fff"><div class="name">muted-fg</div><div class="hex">#6B6B73</div></div>
    <div class="swatch" style="background:#1F1F23;color:#fff"><div class="name">foreground</div><div class="hex">#1F1F23</div></div>
  </div>
  <div style="font-size:13px;color:hsl(var(--muted-foreground))">Cool-leaning neutrals (240° hue) so they sit naturally next to navy and purple without going warm.</div>
</div></body></html>
