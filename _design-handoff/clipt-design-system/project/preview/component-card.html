<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .scard{background:hsl(var(--card));border:1px solid hsl(var(--border));
    border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:8px}
  .scard h4{margin:0;font-size:15px;font-weight:600}
  .scard p{margin:0;font-size:13px;color:hsl(var(--muted-foreground));line-height:1.5}
  .stat{font-size:24px;font-weight:700;letter-spacing:-0.02em}
  .stat .unit{color:hsl(var(--mint));font-weight:700}
</style></head>
<body><div class="card">
  <div class="label">Card · default & stat</div>
  <div class="row" style="gap:14px;align-items:stretch">
    <div class="scard" style="flex:1">
      <div class="row" style="justify-content:space-between"><h4>Last clip</h4>
        <span style="font-size:11px;padding:3px 8px;border-radius:9999px;background:hsl(var(--mint) / 0.12);color:hsl(var(--mint));font-weight:600">+ paid</span>
      </div>
      <p>"Insane 1v4 from last night" — clipped by @rosa, watched 412k times in 3 days.</p>
      <div class="row" style="justify-content:space-between;margin-top:4px">
        <span style="font-size:12px;color:hsl(var(--muted-foreground))">2 days ago</span>
        <button class="btn btn-outline btn-sm">View clip</button>
      </div>
    </div>
    <div class="scard" style="flex:1">
      <span class="label" style="font-size:10px">Earnings · 30 days</span>
      <div class="stat">$2,418<span class="unit">.74</span></div>
      <p style="margin:0">↑ 24% vs last month · split across 41 clips</p>
    </div>
  </div>
</div></body></html>
