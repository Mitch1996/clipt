<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="label">Brand palette · canonical</div>
  <div class="row">
    <div class="swatch" style="background:#1F2A5E;color:#fff">
      <div class="name">Navy</div>
      <div><div class="hex">#1F2A5E</div><div class="hex" style="opacity:.7">hsl 229 50% 25%</div></div>
    </div>
    <div class="swatch" style="background:#7B5BFF;color:#fff">
      <div class="name">Purple</div>
      <div><div class="hex">#7B5BFF</div><div class="hex" style="opacity:.7">hsl 252 100% 68%</div></div>
    </div>
    <div class="swatch" style="background:#00C2A8;color:#fff">
      <div class="name">Mint</div>
      <div><div class="hex">#00C2A8</div><div class="hex" style="opacity:.7">hsl 172 100% 38%</div></div>
    </div>
    <div class="swatch" style="background:#C0392B;color:#fff">
      <div class="name">Warning</div>
      <div><div class="hex">#C0392B</div><div class="hex" style="opacity:.7">hsl 6 63% 46%</div></div>
    </div>
  </div>
  <div style="font-size:13px;color:hsl(var(--muted-foreground));line-height:1.5">
    Navy = authority. Purple = action (every CTA). <strong style="color:#00C2A8">Mint = money</strong> — used only for payouts, earnings, and verified-attribution badges.
  </div>
</div></body></html>
