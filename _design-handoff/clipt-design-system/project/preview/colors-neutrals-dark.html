<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card dark">
  <div class="label" style="color:#9a9aa6">Neutrals · dark mode</div>
  <div class="row">
    <div class="swatch" style="background:hsl(230 24% 7%);color:#eaeaef"><div class="name">background</div><div class="hex">hsl 230 24% 7%</div></div>
    <div class="swatch" style="background:hsl(230 22% 10%);color:#eaeaef"><div class="name">card / popover</div><div class="hex">hsl 230 22% 10%</div></div>
    <div class="swatch" style="background:hsl(230 18% 16%);color:#eaeaef"><div class="name">secondary / muted</div><div class="hex">hsl 230 18% 16%</div></div>
    <div class="swatch" style="background:hsl(230 18% 18%);color:#eaeaef"><div class="name">border / input</div><div class="hex">hsl 230 18% 18%</div></div>
    <div class="swatch" style="background:hsl(240 8% 95%);color:#1F1F23"><div class="name">foreground</div><div class="hex">hsl 240 8% 95%</div></div>
  </div>
  <div style="font-size:13px;color:#9a9aa6">Dark palette is navy-tinted, not pure black — keeps brand identity intact.</div>
</div></body></html>
