<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="label">Spacing · 4-pt scale</div>
  <div style="display:flex;align-items:flex-end;gap:8px">
    <div style="text-align:center"><div style="width:4px;height:24px;background:hsl(var(--accent));margin:0 auto"></div><div class="mono text-muted" style="font-size:10px;margin-top:4px">1<br>4</div></div>
    <div style="text-align:center"><div style="width:8px;height:32px;background:hsl(var(--accent));margin:0 auto"></div><div class="mono text-muted" style="font-size:10px;margin-top:4px">2<br>8</div></div>
    <div style="text-align:center"><div style="width:12px;height:40px;background:hsl(var(--accent));margin:0 auto"></div><div class="mono text-muted" style="font-size:10px;margin-top:4px">3<br>12</div></div>
    <div style="text-align:center"><div style="width:16px;height:48px;background:hsl(var(--accent));margin:0 auto"></div><div class="mono text-muted" style="font-size:10px;margin-top:4px">4<br>16</div></div>
    <div style="text-align:center"><div style="width:24px;height:56px;background:hsl(var(--accent));margin:0 auto"></div><div class="mono text-muted" style="font-size:10px;margin-top:4px">6<br>24</div></div>
    <div style="text-align:center"><div style="width:32px;height:64px;background:hsl(var(--accent));margin:0 auto"></div><div class="mono text-muted" style="font-size:10px;margin-top:4px">8<br>32</div></div>
    <div style="text-align:center"><div style="width:48px;height:72px;background:hsl(var(--accent));margin:0 auto"></div><div class="mono text-muted" style="font-size:10px;margin-top:4px">12<br>48</div></div>
    <div style="text-align:center"><div style="width:64px;height:80px;background:hsl(var(--accent));margin:0 auto"></div><div class="mono text-muted" style="font-size:10px;margin-top:4px">16<br>64</div></div>
    <div style="text-align:center"><div style="width:96px;height:88px;background:hsl(var(--accent));margin:0 auto"></div><div class="mono text-muted" style="font-size:10px;margin-top:4px">24<br>96</div></div>
  </div>
  <div style="font-size:12px;color:hsl(var(--muted-foreground))">Token · px. Card padding 24, section gap 64–96, dense table row 12.</div>
</div></body></html>
