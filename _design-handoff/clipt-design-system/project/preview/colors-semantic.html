<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="label">Semantic tokens · shadcn map</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px">
    <div class="row" style="gap:8px"><div style="width:24px;height:24px;border-radius:6px;background:hsl(229 50% 25%)"></div><span class="mono">--primary</span></div>
    <div class="row" style="gap:8px"><div style="width:24px;height:24px;border-radius:6px;background:hsl(252 100% 68%)"></div><span class="mono">--accent / --ring</span></div>
    <div class="row" style="gap:8px"><div style="width:24px;height:24px;border-radius:6px;background:hsl(172 100% 38%)"></div><span class="mono">--mint <span style="color:hsl(var(--muted-foreground))">(custom)</span></span></div>
    <div class="row" style="gap:8px"><div style="width:24px;height:24px;border-radius:6px;background:hsl(6 63% 46%)"></div><span class="mono">--destructive</span></div>
    <div class="row" style="gap:8px"><div style="width:24px;height:24px;border-radius:6px;background:hsl(240 16% 96%);border:1px solid hsl(var(--border))"></div><span class="mono">--secondary / --muted</span></div>
    <div class="row" style="gap:8px"><div style="width:24px;height:24px;border-radius:6px;background:hsl(0 0% 100%);border:1px solid hsl(var(--border))"></div><span class="mono">--background / --card</span></div>
    <div class="row" style="gap:8px"><div style="width:24px;height:24px;border-radius:6px;background:hsl(240 6% 13%)"></div><span class="mono">--foreground</span></div>
    <div class="row" style="gap:8px"><div style="width:24px;height:24px;border-radius:6px;background:hsl(240 4% 44%)"></div><span class="mono">--muted-foreground</span></div>
  </div>
  <div style="font-size:12px;color:hsl(var(--muted-foreground));line-height:1.5">
    All names match shadcn defaults. <span class="mono">--mint</span> is a Clipt extension for payout / attribution UI; consume via <span class="mono">hsl(var(--mint))</span>.
  </div>
</div></body></html>
