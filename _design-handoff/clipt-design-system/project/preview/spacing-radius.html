<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="label">Radius · base 0.75rem</div>
  <div class="row" style="gap:16px;align-items:flex-end">
    <div style="text-align:center"><div style="width:96px;height:64px;background:hsl(var(--secondary));border:1px solid hsl(var(--border));border-radius:calc(var(--radius) - 4px)"></div><div class="mono text-muted" style="margin-top:6px">sm · 8px</div></div>
    <div style="text-align:center"><div style="width:96px;height:64px;background:hsl(var(--secondary));border:1px solid hsl(var(--border));border-radius:calc(var(--radius) - 2px)"></div><div class="mono text-muted" style="margin-top:6px">md · 10px</div></div>
    <div style="text-align:center"><div style="width:96px;height:64px;background:hsl(var(--secondary));border:1px solid hsl(var(--border));border-radius:var(--radius)"></div><div class="mono text-muted" style="margin-top:6px">lg · 12px</div></div>
    <div style="text-align:center"><div style="width:96px;height:64px;background:hsl(var(--secondary));border:1px solid hsl(var(--border));border-radius:9999px"></div><div class="mono text-muted" style="margin-top:6px">full</div></div>
  </div>
  <div style="font-size:12px;color:hsl(var(--muted-foreground))">Generous corners: navigation, cards, inputs and buttons all default to <span class="mono">md</span> or <span class="mono">lg</span>. Pills (<span class="mono">full</span>) are reserved for badges and avatars.</div>
</div></body></html>
