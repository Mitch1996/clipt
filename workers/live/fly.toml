app = "clipt-live-worker"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

# Single always-on machine. The scheduler runs continuously and fans
# out per-channel asyncio tasks, so we explicitly opt out of
# autoscale-from-zero. min_machines_running = 1 below keeps it alive.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/healthz"
